<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private AI Research Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 420px;
            height: 640px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* --- Auth Screen Styles --- */
        #auth-screen {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        #auth-screen h2 {
            margin-bottom: 8px;
            color: #1f2937;
            text-align: center;
        }

        #auth-screen p {
            color: #6b7280;
            font-size: 0.88rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .primary-btn {
            width: 100%;
            padding: 11px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .primary-btn:hover {
            background-color: #1d4ed8;
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }

        /* --- Chat Screen Styles --- */
        #chat-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            background-color: #2563eb;
            color: #ffffff;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info h3 {
            font-size: 1rem;
        }

        .chat-header-info span {
            font-size: 0.75rem;
            opacity: 0.85;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            background-color: #ffffff;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input:focus {
            border-color: #2563eb;
        }

        .chat-input-area button {
            margin-left: 8px;
            padding: 10px 18px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. AUTH SCREEN -->
        <div id="auth-screen">
            <h2>Welcome Back</h2>
            <p>Enter your assigned credentials to log in.</p>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="primary-btn">Log In</button>
            </form>

            <div id="auth-error" class="error-msg"></div>
        </div>

        <!-- 2. SECURE CHAT SCREEN -->
        <div id="chat-screen" class="hidden">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h3>ETHAN Assistant</h3>
                    <span>User: <strong id="header-username">User</strong></span>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="clearHistory()">Clear Chat</button>
                    <button class="header-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <form class="chat-input-area" id="chat-form" onsubmit="sendMessage(event)">
                <input type="text" id="chat-input" placeholder="Type a message or ask a question..." autocomplete="off" required>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
    // Automatically dynamic to current domain (tunnel or local IP)
    const API_URL = window.location.origin;

    let authInProgress = false;
    let messageInProgress = false;

    async function readApiResponse(response) {
        const rawText = await response.text();
        let data;

        try {
            data = JSON.parse(rawText);
        } catch {
            throw new Error(`Backend returned HTTP ${response.status} non-JSON response.`);
        }

        if (!response.ok) {
            const detail = typeof data.detail === "string" 
                ? data.detail 
                : `Request failed with HTTP ${response.status}.`;
            throw new Error(detail);
        }

        return data;
    }

    function tokenIsExpired(token) {
        try {
            const payloadPart = token.split(".")[1];
            if (!payloadPart) return true;

            const normalized = payloadPart.replace(/-/g, "+").replace(/_/g, "/");
            const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
            const payload = JSON.parse(atob(padded));

            return typeof payload.exp !== "number" || Date.now() >= payload.exp * 1000;
        } catch {
            return true;
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        const token = sessionStorage.getItem("access_token");
        const username = sessionStorage.getItem("username");

        if (token && username && !tokenIsExpired(token)) {
            showChatScreen(username);
            loadChatHistory();
        } else {
            logout();
        }
    });

    async function handleLogin(event) {
        event.preventDefault();
        if (authInProgress) return;

        const usernameInput = document.getElementById("username").value.trim();
        const passwordInput = document.getElementById("password").value;
        const errorDiv = document.getElementById("auth-error");

        errorDiv.textContent = "";

        if (!usernameInput || !passwordInput) {
            errorDiv.textContent = "Please fill in all fields.";
            return;
        }

        authInProgress = true;

        try {
            const response = await fetch(`${API_URL}/token`, {
                method: "POST",
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "1"
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            const data = await readApiResponse(response);

            sessionStorage.setItem("access_token", data.access_token);
            sessionStorage.setItem("username", data.username || usernameInput);

            document.getElementById("password").value = "";
            showChatScreen(data.username || usernameInput);
            loadChatHistory();
        } catch (error) {
            errorDiv.textContent = error instanceof TypeError 
                ? "Cannot reach backend. Verify server and network tunnels are active." 
                : error.message;
        } finally {
            authInProgress = false;
        }
    }

    function showChatScreen(username) {
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("chat-screen").classList.remove("hidden");
        document.getElementById("header-username").textContent = username;
        document.getElementById("chat-input").focus();
    }

    async function loadChatHistory() {
        const token = sessionStorage.getItem("access_token");
        const chatContainer = document.getElementById("chat-messages");
        chatContainer.replaceChildren();

        try {
            const response = await fetch(`${API_URL}/history`, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "ngrok-skip-browser-warning": "1"
                }
            });

            const data = await readApiResponse(response);

            if (data.history && data.history.length > 0) {
                data.history.forEach(item => {
                    const cssClass = item.role === "user" ? "user-message" : "bot-message";
                    appendMessage(item.content, cssClass);
                });
            } else {
                appendMessage("Hello! Connected to your remote session. How can I assist you today?", "bot-message");
            }
        } catch (error) {
            console.error("Failed to load chat history:", error);
            appendMessage("Welcome! Connected to server.", "bot-message");
        }
    }

    async function clearHistory() {
        if (!confirm("Are you sure you want to clear your conversation history?")) return;

        const token = sessionStorage.getItem("access_token");
        try {
            await fetch(`${API_URL}/history`, {
                method: "DELETE",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "ngrok-skip-browser-warning": "1"
                }
            });

            document.getElementById("chat-messages").replaceChildren();
            appendMessage("Chat history cleared. How can I help you next?", "bot-message");
        } catch (error) {
            alert("Could not clear history: " + error.message);
        }
    }

    async function sendMessage(event) {
        if (event) event.preventDefault();
        if (messageInProgress) return;

        const inputField = document.getElementById("chat-input");
        const messageText = inputField.value.trim();
        const token = sessionStorage.getItem("access_token");

        if (!messageText) return;

        if (!token || tokenIsExpired(token)) {
            logout();
            document.getElementById("auth-error").textContent = "Session expired. Please log in again.";
            return;
        }

        messageInProgress = true;
        inputField.disabled = true;

        appendMessage(messageText, "user-message");
        inputField.value = "";

        const pendingMessage = appendMessage("Thinking…", "bot-message");

        try {
            const response = await fetch(`${API_URL}/chat`, {
                method: "POST",
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`,
                    "ngrok-skip-browser-warning": "1"
                },
                body: JSON.stringify({ message: messageText })
            });

            if (response.status === 401) {
                logout();
                document.getElementById("auth-error").textContent = "Session expired. Please log in again.";
                return;
            }

            const data = await readApiResponse(response);
            pendingMessage.textContent = data.reply;
        } catch (error) {
            pendingMessage.textContent = `Error: ${error.message}`;
        } finally {
            messageInProgress = false;
            inputField.disabled = false;

            const chatMessages = document.getElementById("chat-messages");
            chatMessages.scrollTop = chatMessages.scrollHeight;
            inputField.focus();
        }
    }

    function appendMessage(text, className) {
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message", className);
        messageDiv.textContent = text;
        messageDiv.style.whiteSpace = "pre-wrap";

        const chatMessages = document.getElementById("chat-messages");
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        return messageDiv;
    }

    function logout() {
        sessionStorage.removeItem("access_token");
        sessionStorage.removeItem("username");

        document.getElementById("chat-screen").classList.add("hidden");
        document.getElementById("auth-screen").classList.remove("hidden");

        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("auth-error").textContent = "";
        document.getElementById("chat-messages").replaceChildren();

        document.getElementById("username").focus();
    }
    </script>
</body>
</html>
